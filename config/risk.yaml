# Round-aware risk budgets. Times UTC (competition times are BST = UTC+1).
# Posture: survive rounds 1-2 (clear the cutoff, don't blow up), push round 3.
# target_vol = annualized vol budget; sizing = min(target_vol / realized_vol, max_leverage).
# loss_limit = kill switch as a fraction of round-start equity.
# give_back = trailing kill: flatten if equity falls this fraction from the
#   round's peak (protects an intra-round lead; 0 = off).

default:            # prep phase / outside rounds (paper trading)
  max_leverage: 2
  loss_limit: 0.04
  target_vol: 0.30   # gold runs ~0.40 ann vol -> lev ~0.75; was 0.15 (~0.09 lots)

rounds:
  - name: round1    # Jun 21 11pm -> Jun 22 10pm BST, top 200 advance
    start: 2026-06-21T22:00:00Z
    end: 2026-06-22T21:00:00Z
    max_leverage: 3
    loss_limit: 0.05
    target_vol: 0.25
    give_back: 0.05

  - name: round2    # -> Jun 23 10pm BST, top 150 advance
    start: 2026-06-22T21:00:00Z
    end: 2026-06-23T21:00:00Z
    max_leverage: 3
    loss_limit: 0.05
    target_vol: 0.25
    give_back: 0.05

  - name: round3    # -> Jun 24 10pm BST, top 100 to Finals — push
    start: 2026-06-23T21:00:00Z
    end: 2026-06-24T21:00:00Z
    max_leverage: 6
    loss_limit: 0.10
    target_vol: 0.70   # push round: ~4.4%/day vol vs 10% kill (~2.3 sigma); was 0.50
    give_back: 0.07    # let the push run, but lock in a big lead if it reverses

# Economic-calendar event mute (defensive overlay). Forces flat from before_min
# before to after_min after any matching event. OFF until a calendar file is
# populated AND backtested with scripts/eval_blackout.py.
blackout:
  enabled: true
  calendar: data/calendar/events.parquet   # cols: ts(UTC), impact, currency, title
  before_min: 15
  after_min: 15
  min_impact: high          # high | medium | low (this level and above)
  currencies: [USD]         # gold tracks USD; widen if your feed tags others

# Fast volatility circuit breaker (defensive overlay). Forces flat on bars whose
# 1-bar return or short-ATR/baseline ratio is abnormally large — the fast gate
# the (slow, 240-bar) realized-vol sizer can't react to. Bar-count windows
# assume M5. OFF until backtested with scripts/eval_vol_guard.py (may churn like
# the trailing stop did — enable only if the eval shows it helps).
vol_guard:
  enabled: false
  atr_n: 14
  atr_base_n: 288           # ~1 trading day on M5
  atr_mult: 3.0             # short ATR > 3x its baseline median = spike
  ret_limit_bps: 50.0       # |1-bar return| > 0.5% = spike
