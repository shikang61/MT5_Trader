# Books for the portfolio runner (scripts/run_portfolio.py).
# weight = share of the round's risk budget (config/risk.yaml); sum ~1.
# Same symbol in several books is fine — targets are netted before ordering.
# Evidence-based book (real-month backtests, May 12 - Jun 11 ticks).
# Timeframe sweep finding: 5m bars beat 1m across strategies (1m = churn+noise):
#   donchian@5m  +5.1%/mo Sharpe 4.2, 4/5 weeks positive, param plateau
#   vwap_trend@5m +5.7%/mo Sharpe 7.7 (lumpy: trend weeks carry it)
#   london_orb@1m +2.0%/mo Sharpe 1.8 (timeframe-insensitive, original form)
#   sweep_fade@1m +0.9%/mo Sharpe 5.3, +0.35% at 4x costs, wiggle plateau
#     (PDH/PDL stop-run fade; lumpy/back-loaded — paper verdict by Jun 20)
# Benched: regime_switch (duplicates donchian), ofi (needs real depth), fast_mr
# (taker fade, costs eat it), all FX/BTC books (negative cross-asset evidence).
# ratio_mr was -0.95% raw but promoted once the RANGE-regime filter (z_n=288)
# turned it positive — see its book entry below.
magic: 1001           # order tag for this portfolio bot; lets a second strategy
                      # (e.g. run_passive_paper.py, magic 2002) share one account
                      # without netting against these positions. null = manage all.
sl_atr_mult: 8.0      # Disaster stop on the NET position (chandelier trail).
                      # TIGHT (3x) bleeds (donchian +5.1%->-2.2%); TOO WIDE (>=18x)
                      # also negative. Sweet spot ~8x: donchian sweep (research_wide_
                      # stop.py /tmp sweep) MONOTONE tighter-is-better down to 8 on
                      # BOTH return and DD, full-month AND OOS — 8x: +2.6%/DD-3.6%
                      # (OOS +2.6%/DD-2.0%) vs off -1.7%/DD-7.1%. vwap/sweep never
                      # fire; others neutral. ~1 month, donchian-dominated — provisional
                      # 2026-06-18. 0 = off. NOTE: reconcile only attaches SL on a
                      # trade — held-position trailing fix pending.
tp_atr_mult: 0.0      # broker-side take profit (0 = off; strategy exits first)
exposure_cap: 0.5     # cap |net directional exposure| per symbol as a leverage
                      # multiple of equity (net_lots*contract*price/equity). Bounds
                      # books stacking the same direction; 0 = off. Backtest
                      # (research_portfolio_overlay.py): 0.5 lifts Sharpe, cuts
                      # turnover ~30%, small return give-up. Provisional (1 month).
books:
  - strategy: donchian
    symbol: XAUUSD
    timeframe: M5
    weight: 0.35   # most robust book (4x-cost survivor, smooth wiggle) -> anchor
                   # (trimmed 0.40->0.35 in the 2026-06-18 reweight to fund diversifiers)
  - strategy: vwap_trend
    symbol: XAUUSD
    timeframe: M5
    weight: 0.15   # trimmed 0.30->0.15 (2026-06-18 reweight): full-span backtest incl
                   # Jun16-18 OOS = -0.50%@2bp, Sharpe 0.31 — the overweighted laggard.
                   # Kept >0 (not cut) as trend-MONTH tail-hedge: edge ~ one trend week,
                   # and the Jun16-18 reversing/chop tape punishes it specifically.
    params: {regime_filter: true, regime_coarsen: 4}
    # Intraday TREND gate (eff-ratio): plain was -2.7%/Sh-1.4/DD-6.96% on the real
    # feed (May11-Jun10); gated c=4 +1.1%/Sh2.2/DD-2.18%, +ve under 4x cost. coarsen
    # plateau 1-4, cliff at >=5. CAVEAT: month's edge ~ one week (w25 -6.56%->0, tail
    # insurance); worse in ~4/6 weeks. PROVISIONAL: re-confirm on the competition dump.
  - strategy: london_orb
    symbol: XAUUSD
    timeframe: M1
    weight: 0.05   # weak link: param cliff (flat_hour=14 -> -3%), barely survives 4x cost;
                   # trimmed 0.10->0.05 (lost -$19.79 live 2026-06-16) to fund asian_sweep
  - strategy: sweep_fade
    symbol: XAUUSD
    timeframe: M1
    weight: 0.15   # clean low-DD diversifier; raised 0.05->0.15 (2026-06-18). Week-by-week the
                   # SMOOTHEST book (+0.34,-0.23,+0.28,+0.03,+0.47; 4/6, maxDD -0.39%) — the most
                   # robust diversifier, weighted up over ratio_mr's single-week edge.
  - strategy: ratio_mr        # XAU traded off the gold/silver ratio z-score, XAU-ONLY.
    symbol: XAUUSD            # XAG forms the ratio (signal input) but is NOT traded — the
    symbol2: XAGUSD          #  XAG leg was dead weight (wide spread, no edge): on May12-Jun11
    beta: 1.0                #  pair +1.2%/Sh1.1 vs XAU-only +4.4%/Sh3.8 (4/5 wks +, cost-robust).
    timeframe: M5            #  regime gate ON as a DRAWDOWN lever: in-sample it costs return
    weight: 0.1              #  (gated +2.3% < raw +4.4%) but cuts maxDD both windows (in-sample
    trade_symbol2: false     #  -.039->-.034; OOS Jun12-16 -.0148->-.0059, cost-robust). Small
    params: {z_n: 288, regime_filter: true, z_stop: 3.0}   # samples (OOS=3 trades) — revisit at >=20 OOS trades.
                              # z_stop=3.0: bail when |z| climbs past 3 (1.0 beyond the z=2 entry) —
                              # the spread is running away, not reverting; stay flat until |z|<=z_exit.
                              # Added 2026-06-17 after a no-stop short-XAU rode a +37bp gold rally to -$43.
                              # 2026-06-18: HELD at 0.10. A reweight raised it to 0.15 on +6.59%
                              # full-span, but week-by-week showed that edge is ~ONE week (W21
                              # +7.24%; ex-W21 flat-to-negative) — reverted same day. Revisit >=20 OOS.
  - strategy: asian_sweep     # Asian-session (00-06 UTC) H/L sweep-reversal fade, taker, 60m hold.
    symbol: XAUUSD            #  Liquidity-pool research: only new level source surviving costs on
    timeframe: M1            #   gold besides PDH/PDL. Gate (2026-06-16): param plateau + survives
    weight: 0.2              #   real-broker cost stress; null test sweep-specific p=0.005. CAVEAT:
                             #   one in-sample month (n~25). RAISED 0.10->0.20 (2026-06-18) on full-
                             #   span Sh7.0/maxDD-1.7% DESPITE the "confirm before raising" caution —
                             #   provisional; forward-confirm on comp data, trim back if it fades.
